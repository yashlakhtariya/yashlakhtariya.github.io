<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="saffronMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D94122" />
      <stop offset="55%" stop-color="#FF684A" />
      <stop offset="100%" stop-color="#FF8A6B" />
    </linearGradient>
    <linearGradient id="petalFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFE6DE" />
      <stop offset="100%" stop-color="#FFF5F2" />
    </linearGradient>
    <linearGradient id="goldCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF7C5E" />
      <stop offset="100%" stop-color="#FFB088" />
    </linearGradient>
  </defs>

  <!-- Medallion Squircle Base -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#FFFDFB" stroke="#FF684A" stroke-opacity="0.26" stroke-width="2.2" />

  <!-- Outer Sacred Mandala Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#saffronMain)" stroke-width="3.2" />
  <circle cx="64" cy="64" r="44.5" fill="none" stroke="#FF684A" stroke-opacity="0.28" stroke-width="1.1" stroke-dasharray="2.5 3" />

  <!-- Ashtadala Padma (8-Petal Sacred Lotus Compass Rose for the 8 Vedic Dishas) -->
  <g fill="url(#petalFill)" stroke="#FF684A" stroke-opacity="0.55" stroke-width="1.35" stroke-linejoin="round">
    <path d="M64,21 C71,32 72,44 64,54 C56,44 57,32 64,21 Z" />
    <path d="M64,21 C71,32 72,44 64,54 C56,44 57,32 64,21 Z" transform="rotate(45 64 64)" />
    <path d="M64,21 C71,32 72,44 64,54 C56,44 57,32 64,21 Z" transform="rotate(90 64 64)" />
    <path d="M64,21 C71,32 72,44 64,54 C56,44 57,32 64,21 Z" transform="rotate(135 64 64)" />
    <path d="M64,21 C71,32 72,44 64,54 C56,44 57,32 64,21 Z" transform="rotate(180 64 64)" />
    <path d="M64,21 C71,32 72,44 64,54 C56,44 57,32 64,21 Z" transform="rotate(225 64 64)" />
    <path d="M64,21 C71,32 72,44 64,54 C56,44 57,32 64,21 Z" transform="rotate(270 64 64)" />
    <path d="M64,21 C71,32 72,44 64,54 C56,44 57,32 64,21 Z" transform="rotate(315 64 64)" />
  </g>

  <!-- Inner Lotus Sanctuary Ring -->
  <circle cx="64" cy="64" r="26" fill="#FFFDFB" fill-opacity="0.7" stroke="#FF684A" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Top Devotional Tilak Chandrika & Dham Bindu at 12 o'clock -->
  <path d="M56.5,15.5 Q64,20.5 71.5,15.5" fill="none" stroke="#E64D2D" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="64" cy="12.5" r="4" fill="url(#saffronMain)" stroke="#FFFDFB" stroke-width="1.2" />

  <!-- South Counterweight Lotus Tail -->
  <path d="M64,101 L71.5,64 L64,69 L56.5,64 Z" fill="#CBD5E1" />
  <circle cx="64" cy="92" r="2.2" fill="#94A3B8" />

  <!-- North Devotional Dham Pointer (Shikhara / Tilak Spearhead) -->
  <path d="M64,22 L75.5,65.5 L64,58.5 L52.5,65.5 Z" fill="url(#saffronMain)" />
  <!-- Inner Sacred Tilak Flame Line -->
  <path d="M64,31 L68,57 L64,54.5 L60,57 Z" fill="url(#goldCore)" />

  <!-- Center Sacred Bindu Hub -->
  <circle cx="64" cy="64" r="6.2" fill="#FFFDFB" stroke="#D94122" stroke-width="2.6" />
  <circle cx="64" cy="64" r="2.4" fill="#FF684A" />
</svg>
